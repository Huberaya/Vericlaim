name: Continuous integration

on:
  pull_request:
    branches:
      - main
      # Follow-up corrections can be reviewed against PR #11 without merging it.
      - arena/2672a0ba-vericlaim
      # Chantier 2 (recette) works on its own branch; its checks must run on push,
      # not only once a pull request exists.
      - arena/0a0b694c-vericlaim
      - arena/c5488624-vericlaim
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vericlaim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/vericlaim-ci.db
      AUTO_CREATE_SCHEMA: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install reviewed backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run isolated backend tests
        run: |
          set -uo pipefail
          # Le rapport JUnit survit à l'échec : sans lui, un test rouge ne laisserait
          # qu'un code de sortie, et les journaux bruts ne sont pas toujours
          # récupérables. Le sort de l'étape est décidé plus bas, une fois les
          # échecs nommés.
          rm -f /tmp/vericlaim-ci.db /tmp/vericlaim-junit.xml
          ( cd backend && python -m pytest -q --junitxml=/tmp/vericlaim-junit.xml )
          echo "pytest_status=$?" >> "${GITHUB_ENV}"

      - name: Nommer les échecs dans les annotations
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f /tmp/vericlaim-junit.xml ]; then
            echo "::error::Aucun rapport JUnit produit : la suite n'a pas pu démarrer."
            echo "pytest_status=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          python scripts/ci/annotate_junit.py /tmp/vericlaim-junit.xml
          echo "pytest_status=$?" >> "${GITHUB_ENV}"

      - name: Statuer sur la suite de tests
        run: |
          set -uo pipefail
          status="${pytest_status:-1}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::La suite de tests a échoué (code ${status}). Voir les annotations ci-dessus."
            exit 1
          fi
          echo "Suite de tests verte."

      - name: Contrôler la discipline de migration
        run: |
          set -euo pipefail
          # Garde unique, partagée par la CI et les tests locaux : une seule tête,
          # une chaîne linéaire, et aucun document qui cite une révision périmée.
          # Sur une pull request, on compare à la référence de base : sans elle,
          # une migration escamotée (tête modifiée sans migration ajoutée) passe.
          # Sur une poussée directe, il n'y a pas de base de comparaison fiable :
          # les contrôles autonomes s'appliquent.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            python scripts/ci/check_migration_discipline.py --base-ref "origin/${GITHUB_BASE_REF}"
          else
            python scripts/ci/check_migration_discipline.py
          fi

      - name: Verify the reviewed Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          # La tête est comparée à elle-même, pas à une constante : coder une
          # révision en dur fait rougir la CI à la première migration ajoutée et
          # n'éprouve donc plus rien. Ce qui compte est qu'il n'existe **qu'une
          # seule** tête, condition d'un `upgrade head` sans ambiguïté.
          heads="$(DATABASE_URL='postgresql+psycopg://vericlaim@db.invalid:5432/vericlaim' \
            AUTO_CREATE_SCHEMA=false python -m alembic heads)"
          echo "$heads"
          if [ "$(printf '%s\n' "$heads" | grep -c '(head)')" -ne 1 ]; then
            echo "::error::attendu exactement une tête Alembic, obtenu : $heads"
            exit 1
          fi
          DATABASE_URL='postgresql+psycopg://vericlaim@db.invalid:5432/vericlaim' \
            AUTO_CREATE_SCHEMA=false python -m alembic upgrade head --sql > /tmp/vericlaim-alembic.sql
          grep -F 'ENABLE ROW LEVEL SECURITY' /tmp/vericlaim-alembic.sql >/dev/null
          grep -F 'FORCE ROW LEVEL SECURITY' /tmp/vericlaim-alembic.sql >/dev/null

      - name: Scan tracked source for credential signatures
        run: |
          set -euo pipefail
          ! git grep -nE -- \
            '(npg_[A-Za-z0-9_-]{8,}|napi_[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(test|live)_[A-Za-z0-9_-]{12,})'

      - name: Check whitespace integrity
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [ "${{ github.event_name }}" = "push" ] && \
            [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            git show --check --format= HEAD
          fi

  postgres-tenant-isolation:
    # SQLite cannot express row-level security. This job rebuilds the reviewed
    # Alembic chain on a throwaway PostgreSQL server and proves tenant
    # isolation with the real runtime role before anything is merged.
    name: PostgreSQL tenant isolation (RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/vericlaim-ci.db
      AUTO_CREATE_SCHEMA: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      VERICLAIM_TEST_POSTGRES_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install reviewed backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PostgreSQL tenant isolation tests
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_postgres_tenant_isolation.py tests/test_postgres_document_isolation.py \
            tests/test_postgres_operational_integrity.py tests/test_postgres_purge_concurrency.py

  recette-qualification:
    # The mission's central requirement: prove the *real* data plane works, not
    # just that the code imports. This job runs the same harness an operator runs
    # locally (tools/recette): a real PostgreSQL 16 server provisioned with the
    # reviewed infra/neon role scripts, a real S3 API through the application's
    # own boto3 adapter, real worker processes and a real OIDC round-trip.
    #
    # Deliberately NOT a substitute for the Vercel Preview: there is no SSO
    # bypass here, no Neon access and no ClamAV. See
    # docs/infrastructure/13-verdict-recette-exploitable.md.
    name: Recette qualification (real data plane)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to 3.12 on purpose: the harness needs the embedded PostgreSQL
      # server (``pgserver``), which ships prebuilt wheels for cp39-cp312 only and
      # publishes no source distribution. On 3.13 pip resolves nothing and the
      # install step fails before any test runs. 3.12 is also what the backend
      # container uses, so the job matches the deployed runtime.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the application and the recette harness
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pgserver>=0.1.4" "moto[server]>=5.0"

      # Fail fast with an explicit message rather than letting every step below
      # fail on an import. ``pgserver`` is imported directly (not via the
      # application), so a resolution regression is reported here, at once.
      - name: Verify the harness dependencies really imported
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          import sys

          import moto.server
          import pgserver

          print(f"python {platform.python_version()} ({sys.executable})")
          print(f"pgserver {getattr(pgserver, '__version__', 'unknown')}")
          print(f"moto {getattr(moto, '__version__', 'unknown')}")
          PY

      # The console output is echoed back as a check annotation when the journey
      # fails. Job logs are not always retrievable (signed artifact URLs are
      # blocked from some operator environments), and a failure nobody can read is
      # worthless. ``tee`` + a tail keeps the diagnosis in the check itself.
      - name: Run the end-to-end recette journey
        env:
          PYTHONPATH: .
        run: |
          set -uo pipefail
          mkdir -p .recette
          python -m tools.recette.run --json-out .recette/last-run.json 2>&1 | tee .recette/console.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "--- tail of .recette/console.log ---"
            tail -n 40 .recette/console.log
            tail -n 40 .recette/console.log | sed 's/^/::error title=Recette console::/'
            exit "$status"
          fi

      - name: Prove a backup can actually be restored
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python tools/recette/restore.py

      # A-08 : l'archive des objets ne peut pas être prouvée dans le job
      # « Backend verification », qui n'installe pas moto. Ce job-ci l'installe
      # déjà, ainsi que pgserver : c'est le seul endroit où les tests S3 de
      # sauvegarde/restauration s'exécutent réellement plutôt que d'être sautés.
      # Sans cette étape, la couverture S3 serait annoncée mais jamais courue.
      - name: Prove object backups are restorable (S3 contract)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_a08_backup_restore.py::test_one_object_is_archived_with_its_bytes \
            tests/test_a08_backup_restore.py::test_several_objects_across_buckets_are_archived \
            tests/test_a08_backup_restore.py::test_missing_source_object_is_reported_not_skipped \
            tests/test_a08_backup_restore.py::test_capture_refuses_to_escape_the_backup_directory \
            tests/test_a08_backup_restore.py::test_verify_detects_a_corrupted_object_archive \
            tests/test_a08_backup_restore.py::test_verify_detects_a_wrong_object_checksum \
            tests/test_a08_backup_restore.py::test_restore_writes_objects_to_a_distinct_destination \
            tests/test_a08_backup_restore.py::test_replaying_restore_is_idempotent \
            tests/test_a08_backup_restore.py::test_collision_with_a_different_existing_object_is_refused \
            tests/test_a08_backup_restore.py::test_restore_refuses_to_target_the_source \
            tests/test_a08_backup_restore.py::test_sources_are_never_modified_nor_deleted \
            tests/test_a08_backup_restore.py::test_object_paths_are_injective_across_distinct_keys \
            tests/test_a08_backup_restore.py::test_object_paths_stay_confined_and_stable \
            tests/test_a08_backup_restore.py::test_capture_aborts_rather_than_overwrite_on_path_collision \
            tests/test_a08_backup_restore.py::test_every_distinct_key_is_archived_separately \
            tests/test_a08_backup_restore.py::test_idempotence_is_decided_on_bytes_not_metadata \
            tests/test_a08_backup_restore.py::test_matching_bytes_are_recognised_even_without_metadata \
            tests/test_a08_backup_restore.py::test_write_is_verified_by_rereading_the_stored_bytes \
            tests/test_a08_backup_restore.py::test_oversized_objects_are_reported_unverified_never_assumed_identical

      - name: Publish the qualification transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recette-transcript
          path: |
            .recette/last-run.json
            .recette/restore-report.json
            .recette/artifacts/*.log
          if-no-files-found: warn

  restore-rehearsal:
    name: Répétition de restauration sur PostgreSQL jetable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Aucune donnée réelle, aucun secret : la base vit le temps du travail.
    #
    # Elle porte **TLS**, et ce n'est pas un ornement : Neon refuse les connexions en clair, et
    # `infra/neon/verify_runtime.py` refuse par principe une connexion non chiffrée
    # (`require_tls`). Répéter la restauration sur une base sans TLS reviendrait à répéter une
    # procédure inexécutable en production — c'est précisément ce que la première exécution
    # réelle de ce travail a montré. L'image `postgres:16-alpine` n'embarque aucun certificat et
    # `services:` ne permet pas de passer `-c ssl=on` : la base est donc installée sur le runner,
    # dont le paquet `ssl-cert` fournit un certificat auto-signé.
    env:
      PGPASSWORD: rehearsal-only
      # Toutes les commandes `psql` de ce travail exigent TLS : la répétition doit échouer si
      # la base revenait un jour sans chiffrement, plutôt que de réussir dans des conditions
      # qui n'existent pas en production.
      PGSSLMODE: require
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      VERICLAIM_APP_PASSWORD: rehearsal-app-only
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Démarrer un PostgreSQL jetable, avec TLS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql
          PG_VERSION="$(ls /etc/postgresql | head -n1)"
          sudo sed -i 's/^#*ssl = .*/ssl = on/' "/etc/postgresql/${PG_VERSION}/main/postgresql.conf"
          sudo pg_ctlcluster "${PG_VERSION}" main restart
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'rehearsal-only';"
          sudo -u postgres createdb vericlaim
          # Si TLS n'est pas actif, on s'arrête ici et on le dit. Le produit, lui, refuserait la
          # connexion plus loin avec un message qui ne nommerait pas la cause.
          psql "host=127.0.0.1 port=5432 dbname=postgres user=postgres sslmode=require" -tAc "select case when ssl then 'TLS actif' else 'TLS inactif' end from pg_stat_ssl where pid = pg_backend_pid()" | grep -qx "TLS actif"
          echo "PostgreSQL ${PG_VERSION} jetable démarré, TLS actif."

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Installer les dépendances backend verrouillées
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create the migration, runtime and backup roles
        # Les trois rôles sont distincts, comme en production, et le rôle de sauvegarde porte
        # BYPASSRLS : sans lui, `pg_dump` échoue ou sauvegarde une base amputée de ses données
        # locataires. Ces trois identités sont décrites dans docs/operations/restore-runbook.md.
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vericlaim_migrator LOGIN PASSWORD 'rehearsal-migrator-only' CREATEDB NOBYPASSRLS;
          CREATE ROLE vericlaim_app LOGIN PASSWORD 'rehearsal-app-only' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE vericlaim_backup LOGIN PASSWORD 'rehearsal-backup-only' NOBYPASSRLS;
          ALTER ROLE vericlaim_backup BYPASSRLS;
          ALTER DATABASE vericlaim OWNER TO vericlaim_migrator;
          GRANT CONNECT ON DATABASE vericlaim TO vericlaim_app, vericlaim_backup;
          SQL

      - name: Rehearse a restore end to end
        run: |
          set -euo pipefail
          python scripts/ci/rehearse_restore.py \
            --source-url 'postgresql+psycopg://vericlaim_migrator:rehearsal-migrator-only@127.0.0.1:5432/vericlaim?sslmode=require' \
            --backup-url 'postgresql+psycopg://vericlaim_backup:rehearsal-backup-only@127.0.0.1:5432/vericlaim?sslmode=require' \
            --admin-url 'postgresql+psycopg://postgres:rehearsal-only@127.0.0.1:5432/postgres?sslmode=require' \
            --target-db vericlaim_restore_rehearsal \
            --app-password-env VERICLAIM_APP_PASSWORD \
            --json /tmp/vericlaim-rehearsal.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("/tmp/vericlaim-rehearsal.json").read_text(encoding="utf-8"))
          assert report["failures"] == [], report["failures"]
          assert report["verdict"] == "répétition réussie", report["verdict"]
          print("répétition vérifiée :", len(report["steps"]), "étapes")
          PY

  frontend-verification:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck frontend
        # `tsc --noEmit` directement : la commande est lisible et ne dépend pas
        # d'un script de `package.json` qu'on pourrait vider sans s'en apercevoir.
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
