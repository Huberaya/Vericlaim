name: Continuous integration

on:
  pull_request:
    branches:
      - main
      # Follow-up corrections can be reviewed against PR #11 without merging it.
      - arena/2672a0ba-vericlaim
      # Chantier 2 (recette) works on its own branch; its checks must run on push,
      # not only once a pull request exists.
      - arena/0a0b694c-vericlaim
      - arena/c5488624-vericlaim
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vericlaim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/vericlaim-ci.db
      AUTO_CREATE_SCHEMA: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install reviewed backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run isolated backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          rm -f /tmp/vericlaim-ci.db
          python -m pytest -q

      - name: Verify the reviewed Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          DATABASE_URL='postgresql+psycopg://vericlaim@db.invalid:5432/vericlaim' \
            AUTO_CREATE_SCHEMA=false python -m alembic heads | grep -Fx 'a7d4c9e2b510 (head)'
          DATABASE_URL='postgresql+psycopg://vericlaim@db.invalid:5432/vericlaim' \
            AUTO_CREATE_SCHEMA=false python -m alembic upgrade head --sql > /tmp/vericlaim-alembic.sql
          grep -F 'ENABLE ROW LEVEL SECURITY' /tmp/vericlaim-alembic.sql >/dev/null
          grep -F 'FORCE ROW LEVEL SECURITY' /tmp/vericlaim-alembic.sql >/dev/null

      - name: Scan tracked source for credential signatures
        run: |
          set -euo pipefail
          ! git grep -nE -- \
            '(npg_[A-Za-z0-9_-]{8,}|napi_[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(test|live)_[A-Za-z0-9_-]{12,})'

      - name: Check whitespace integrity
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [ "${{ github.event_name }}" = "push" ] && \
            [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            git show --check --format= HEAD
          fi

  postgres-tenant-isolation:
    # SQLite cannot express row-level security. This job rebuilds the reviewed
    # Alembic chain on a throwaway PostgreSQL server and proves tenant
    # isolation with the real runtime role before anything is merged.
    name: PostgreSQL tenant isolation (RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/vericlaim-ci.db
      AUTO_CREATE_SCHEMA: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      VERICLAIM_TEST_POSTGRES_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install reviewed backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PostgreSQL tenant isolation tests
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_postgres_tenant_isolation.py tests/test_postgres_document_isolation.py \
            tests/test_postgres_operational_integrity.py tests/test_postgres_purge_concurrency.py

  recette-qualification:
    # The mission's central requirement: prove the *real* data plane works, not
    # just that the code imports. This job runs the same harness an operator runs
    # locally (tools/recette): a real PostgreSQL 16 server provisioned with the
    # reviewed infra/neon role scripts, a real S3 API through the application's
    # own boto3 adapter, real worker processes and a real OIDC round-trip.
    #
    # Deliberately NOT a substitute for the Vercel Preview: there is no SSO
    # bypass here, no Neon access and no ClamAV. See
    # docs/infrastructure/13-verdict-recette-exploitable.md.
    name: Recette qualification (real data plane)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to 3.12 on purpose: the harness needs the embedded PostgreSQL
      # server (``pgserver``), which ships prebuilt wheels for cp39-cp312 only and
      # publishes no source distribution. On 3.13 pip resolves nothing and the
      # install step fails before any test runs. 3.12 is also what the backend
      # container uses, so the job matches the deployed runtime.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the application and the recette harness
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pgserver>=0.1.4" "moto[server]>=5.0"

      # Fail fast with an explicit message rather than letting every step below
      # fail on an import. ``pgserver`` is imported directly (not via the
      # application), so a resolution regression is reported here, at once.
      - name: Verify the harness dependencies really imported
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          import sys

          import moto.server
          import pgserver

          print(f"python {platform.python_version()} ({sys.executable})")
          print(f"pgserver {getattr(pgserver, '__version__', 'unknown')}")
          print(f"moto {getattr(moto, '__version__', 'unknown')}")
          PY

      - name: Run the end-to-end recette journey
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m tools.recette.run --json-out .recette/last-run.json

      - name: Prove a backup can actually be restored
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python tools/recette/restore.py

      - name: Publish the qualification transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recette-transcript
          path: |
            .recette/last-run.json
            .recette/restore-report.json
            .recette/artifacts/*.log
          if-no-files-found: warn

  frontend-verification:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
