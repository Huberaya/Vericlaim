name: Intégration continue

# Ce fichier remplace une CI qui échouait sur chaque poussée : elle comparait la tête Alembic à un
# identifiant écrit en dur qui n'était plus la tête du dépôt. Une CI toujours rouge ne protège
# rien — elle apprend surtout à ignorer le rouge. Les identifiants en dur sont donc supprimés, et
# remplacés par une garde (`scripts/ci/check_migration_discipline.py`) qui lit la chaîne réelle.
#
# Trois choses y ont été ajoutées, chacune pour un manque constaté :
#   1. le frontend est typé et compilé (10 pages TypeScript n'étaient vérifiées par rien) ;
#   2. la discipline de migration est contrôlée (tête unique, pas de doublon, pas de migration
#      escamotée, aucune révision périmée citée comme tête dans les documents) ;
#   3. une **répétition de restauration** s'exécute sur un vrai PostgreSQL, avec sauvegarde,
#      restauration, grants, vérification RLS et test de fumée du produit. Le runbook l'exigeait
#      depuis C2 ; personne ne l'exécutait.
#
# Aucun secret n'est requis : la base de répétition est éphémère et jetable.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vericlaim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Vérification du backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/vericlaim-ci.db
      AUTO_CREATE_SCHEMA: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Installer les dépendances backend verrouillées
        working-directory: backend
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter les tests backend isolés
        working-directory: backend
        run: |
          set -euo pipefail
          rm -f /tmp/vericlaim-ci.db
          python -m pytest -q

      - name: Vérifier que le SQL généré porte la sécurité au niveau des lignes
        working-directory: backend
        run: |
          set -euo pipefail
          # Le SQL hors ligne est généré sans base : aucune migration n'est appliquée par la CI.
          DATABASE_URL='postgresql+psycopg://vericlaim@db.invalid:5432/vericlaim' \
            AUTO_CREATE_SCHEMA=false python -m alembic upgrade head --sql > /tmp/vericlaim-alembic.sql
          grep -F 'ENABLE ROW LEVEL SECURITY' /tmp/vericlaim-alembic.sql >/dev/null
          grep -F 'FORCE ROW LEVEL SECURITY' /tmp/vericlaim-alembic.sql >/dev/null

      - name: Contrôler la discipline de migration
        # La base de comparaison est celle de la pull request ; sur une poussée directe, la
        # révision avant la poussée. Sinon, la garde vérifie ce qu'elle peut vérifier seule.
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            python scripts/ci/check_migration_discipline.py --base-ref "$base"
          else
            python scripts/ci/check_migration_discipline.py
          fi

      - name: Rechercher des signatures d'identifiants dans les sources suivies
        run: |
          set -euo pipefail
          ! git grep -nE -- \
            '(npg_[A-Za-z0-9_-]{8,}|napi_[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(test|live)_[A-Za-z0-9_-]{12,})'

      - name: Vérifier l'intégrité des espaces
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [ "${{ github.event_name }}" = "push" ] && \
            [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            git show --check --format= HEAD
          fi

  frontend-verification:
    name: Vérification du frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend verrouillées
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Vérifier les types du frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Compiler le frontend
        working-directory: frontend
        run: npm run build

  restore-rehearsal:
    name: Répétition de restauration sur PostgreSQL jetable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Aucune donnée réelle, aucun secret : la base vit le temps du travail.
    #
    # Elle porte **TLS**, et ce n'est pas un ornement : Neon refuse les connexions en clair, et
    # `infra/neon/verify_runtime.py` refuse par principe une connexion non chiffrée
    # (`require_tls`). Répéter la restauration sur une base sans TLS reviendrait à répéter une
    # procédure inexécutable en production — c'est précisément ce que la première exécution
    # réelle de ce travail a montré. L'image `postgres:16-alpine` n'embarque aucun certificat et
    # `services:` ne permet pas de passer `-c ssl=on` : la base est donc installée sur le runner,
    # dont le paquet `ssl-cert` fournit un certificat auto-signé.
    env:
      PGPASSWORD: rehearsal-only
      # Toutes les commandes `psql` de ce travail exigent TLS : la répétition doit échouer si
      # la base revenait un jour sans chiffrement, plutôt que de réussir dans des conditions
      # qui n'existent pas en production.
      PGSSLMODE: require
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      VERICLAIM_APP_PASSWORD: rehearsal-app-only
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Démarrer un PostgreSQL jetable, avec TLS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql
          PG_VERSION="$(ls /etc/postgresql | head -n1)"
          sudo sed -i 's/^#*ssl = .*/ssl = on/' "/etc/postgresql/${PG_VERSION}/main/postgresql.conf"
          sudo pg_ctlcluster "${PG_VERSION}" main restart
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'rehearsal-only';"
          sudo -u postgres createdb vericlaim
          # Si TLS n'est pas actif, on s'arrête ici et on le dit. Le produit, lui, refuserait la
          # connexion plus loin avec un message qui ne nommerait pas la cause.
          psql "host=127.0.0.1 port=5432 dbname=postgres user=postgres sslmode=require" -tAc "select case when ssl then 'TLS actif' else 'TLS inactif' end from pg_stat_ssl where pid = pg_backend_pid()" | grep -qx "TLS actif"
          echo "PostgreSQL ${PG_VERSION} jetable démarré, TLS actif."

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Installer les dépendances backend verrouillées
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create the migration, runtime and backup roles
        # Les trois rôles sont distincts, comme en production, et le rôle de sauvegarde porte
        # BYPASSRLS : sans lui, `pg_dump` échoue ou sauvegarde une base amputée de ses données
        # locataires. Ces trois identités sont décrites dans docs/operations/restore-runbook.md.
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vericlaim_migrator LOGIN PASSWORD 'rehearsal-migrator-only' CREATEDB NOBYPASSRLS;
          CREATE ROLE vericlaim_app LOGIN PASSWORD 'rehearsal-app-only' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE vericlaim_backup LOGIN PASSWORD 'rehearsal-backup-only' NOBYPASSRLS;
          ALTER ROLE vericlaim_backup BYPASSRLS;
          ALTER DATABASE vericlaim OWNER TO vericlaim_migrator;
          GRANT CONNECT ON DATABASE vericlaim TO vericlaim_app, vericlaim_backup;
          SQL

      - name: Rehearse a restore end to end
        run: |
          set -euo pipefail
          python scripts/ci/rehearse_restore.py \
            --source-url 'postgresql+psycopg://vericlaim_migrator:rehearsal-migrator-only@127.0.0.1:5432/vericlaim?sslmode=require' \
            --backup-url 'postgresql+psycopg://vericlaim_backup:rehearsal-backup-only@127.0.0.1:5432/vericlaim?sslmode=require' \
            --admin-url 'postgresql+psycopg://postgres:rehearsal-only@127.0.0.1:5432/postgres?sslmode=require' \
            --target-db vericlaim_restore_rehearsal \
            --app-password-env VERICLAIM_APP_PASSWORD \
            --json /tmp/vericlaim-rehearsal.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("/tmp/vericlaim-rehearsal.json").read_text(encoding="utf-8"))
          assert report["failures"] == [], report["failures"]
          assert report["verdict"] == "répétition réussie", report["verdict"]
          print("répétition vérifiée :", len(report["steps"]), "étapes")
          PY
