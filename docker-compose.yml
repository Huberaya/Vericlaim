services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vericlaim
      POSTGRES_USER: vericlaim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vericlaim-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vericlaim -d vericlaim"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://vericlaim:${POSTGRES_PASSWORD:-vericlaim-dev-only}@postgres:5432/vericlaim
      CORS_ORIGINS: http://localhost:3000
      EU_2024_825_FR_TRANSPOSITION_STATUS: ${EU_2024_825_FR_TRANSPOSITION_STATUS:-unknown}
      VERICLAIM_CERTIFICATE_REGISTRY_JSON: "${VERICLAIM_CERTIFICATE_REGISTRY_JSON:-[]}"
      TESSERACT_LANGUAGES: fra+eng
      MAX_UPLOAD_BYTES: 15728640
      MAX_PDF_PAGES: 25
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
